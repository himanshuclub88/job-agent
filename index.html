<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gmail</title>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        h1, h2, h3 {
            margin-top: 30px;
        }

        a {
            color: #1967d2;
        }

        pre {
            background: #f5f5f5;
            padding: 15px;
            overflow-x: auto;
            border-radius: 8px;
        }

        code {
            background: #f5f5f5;
            padding: 2px 5px;
            border-radius: 4px;
        }

        blockquote {
            border-left: 4px solid #ccc;
            padding-left: 15px;
            color: #666;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background: #f5f5f5;
        }
    </style>
</head>

<body>

    <div id="content">
        Loading...
    </div>

<script>
    async function loadMarkdown() {
        try {
            const response = await fetch("output/summary.md");

            if (!response.ok) {
                throw new Error("Could not load summary.md");
            }

            const markdown = await response.text();

            document.getElementById("content").innerHTML =
                marked.parse(markdown);

        } catch (error) {
            document.getElementById("content").innerHTML =
                `<p>Error: ${error.message}</p>`;
        }
    }

    loadMarkdown();
</script>

</body>
</html>
